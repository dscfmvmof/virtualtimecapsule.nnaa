  <style>
    body {

    }

    .logo {

    p {

    }

    footer {

    /* Light/Dark Mode Variables */
:root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #1a1a2e;
    --bg-card: #171722;
    --text-primary: #e0d9ff;
    --text-secondary: #c5b8ff;
    --text-muted: #bdb2ff;
    --accent-primary: #9d4edd;
    --accent-secondary: #c77dff;
    --border-color: #2a2a40;
    --shadow-color: rgba(128, 0, 255, 0.18);
}

[data-theme="light"] {
    --bg-primary: #f8f9fa;
    --bg-secondary: #ffffff;
    --bg-card: #ffffff;
    --text-primary: #2d3748;
    --text-secondary: #4a5568;
    --text-muted: #718096;
    --accent-primary: #7c3aed;
    --accent-secondary: #8b5cf6;
    --border-color: #e2e8f0;
    --shadow-color: rgba(0, 0, 0, 0.1);
}

/* Theme Toggle Styles */
.theme-toggle {
    margin-left: 20px;
}

.theme-btn {
    background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.3s ease;
    box-shadow: 0 2px 8px var(--shadow-color);
}

.theme-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 4px 12px var(--shadow-color);
}

/* Update existing styles to use CSS variables */
body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-primary);
    color: var(--text-primary);
    font-family: "Poppins", sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    transition: background-color 0.3s ease, color 0.3s ease;
}

header {
    background-color: var(--bg-secondary);
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 8px var(--shadow-color);
    position: sticky;
    top: 0;
    z-index: 10;
}

nav a {
    color: var(--text-secondary);
    margin: 0 12px;
    text-decoration: none;
    font-size: 16px;
}

nav a:hover {
    color: var(--accent-secondary);
}

.logo-title h2 {
    color: var(--text-secondary);
    font-size: 18px;
    margin: 0;
    line-height: 1;
}

footer {
    background-color: var(--bg-secondary);
    text-align: center;
    padding: 15px;
    color: var(--text-muted);
    font-size: 14px;
    border-top: 1px solid var(--border-color);
}

/* For generator.html */
.card {
    width: 100%;
    max-width: 720px;
    background: var(--bg-card);
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 8px 30px var(--shadow-color);
}

textarea#topic {
    width: 100%;
    height: 100px;
    padding: 14px 44px 14px 14px;
    border-radius: 12px;
    border: 2px solid transparent;
    background: linear-gradient(var(--bg-secondary), var(--bg-secondary)) padding-box, 
                linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)) border-box;
    color: var(--text-primary);
    font-size: 15px;
    line-height: 1.4;
    resize: none;
    outline: none;
    box-shadow: 0 0 14px var(--shadow-color);
}

/* For capsule.html Bootstrap overrides */
.card {
    background-color: var(--bg-secondary) !important;
    color: var(--text-primary) !important;
}

.form-control {
    background-color: var(--bg-primary) !important;
    color: var(--text-primary) !important;
    border: 1px solid var(--border-color) !important;
}
  </style>
</head>
<body>
  <header>
     <div class="logo-title">
      <img src="vtc2.jpeg" alt="VTC Logo" class="logo">
      <h2>Virtual Time Capsule</h2>
    </div>
    <nav class="navbar navbar-expand-lg">

      <a href="index.html">Home</a>
      <a href="auth.html" id="profileLink">Profile</a>
      <a href="generator.html">Generator</a>
      <a href="capsule.html">Capsule</a>
    </nav>

    <div class="theme-toggle">
    <button id="themeToggle" class="theme-btn" aria-label="Toggle dark mode">
        <span class="theme-icon">🌙</span>
    </button>
</div>
  </header>

  <main>
    <img src="vtc.jpeg" alt="Time Capsule Animation"></img>
    <p>Your words. Your legacy. Sealed in time.</p>

  </main>

  <footer>
    Created by Nuraiym & Nurdaulet & Azat & Arsen © 2025 Time Capsule. All rights reserved.
  </footer>

  <script>
function initTheme() {
    const button = document.getElementById('themeToggle');
    if (!button) return;
    
    button.onclick = function() {
        const html = document.documentElement;
        const isDark = html.getAttribute('data-theme') === 'dark';
        const newTheme = isDark ? 'light' : 'dark';
        
        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        
        // Меняем иконку
        const icon = button.querySelector('.theme-icon');
        if (icon) {
            icon.textContent = newTheme === 'dark' ? '🌙' : '☀️';
        }
        
        console.log('Theme switched to:', newTheme);
    };
}

// Запускаем когда страница загрузится
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initTheme);
} else {
    initTheme();
}

document.addEventListener('DOMContentLoaded', function() {
    const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
    const profileLink = document.getElementById('profileLink');
    
    if (currentUser && profileLink) {
        profileLink.innerHTML = `👤 ${currentUser.name}`;
        profileLink.style.color = '#c77dff';
    }
});
</script>
</body>
</html>
